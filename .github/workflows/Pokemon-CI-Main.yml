
name: Pokemon-CI-Main

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository
      - uses: actions/checkout@v6

      # Step 2: Configure .NET SDK
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      # Step 3: Cache NuGet packages
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      # Step 4: Restore dependencies with grouped logs
      - name: Restore
        run: |
          echo "::group::dotnet restore output"
          dotnet restore PokeTeams.sln
          echo "::endgroup::"

      # Step 5: Build application
      - name: Build
        run: dotnet build PokeTeams.sln -c Release --no-restore

      # Step 6: Run tests
      - name: Test
        run: dotnet test PokeTeams.sln -c Release --no-build --logger "trx;LogFileName=results.trx" --results-directory TestResults

      # Step 7: Generate job summary
      - name: Job summary
        if: always()
        run: |
          echo "::notice title=Build::Built ${GITHUB_SHA::7} on ${{ runner.os }}"

          COUNTERS=$(grep -o '<Counters [^>]*' TestResults/results.trx || echo "no test results")

          {
            echo "## PokeTeams CI"
            echo "| Item | Value |"
            echo "|---|---|"
            echo "| Commit | \`${GITHUB_SHA::7}\` |"
            echo "| Trigger | ${{ github.event_name }} |"
            echo "| Actor | ${GITHUB_ACTOR} |"
            echo "| Tests | \`${COUNTERS}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
