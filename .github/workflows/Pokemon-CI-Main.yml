
name: Pokemon-CI-Main

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # PHASE 1 & 2.1: Build and test on Linux and Windows
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    defaults:
      run:
        shell: bash

    steps:
      # Step 1: Checkout repository
      - uses: actions/checkout@v6

      # Step 2: Define reusable YAML anchor for .NET setup
      - &setup-dotnet
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      # Step 3: Cache NuGet dependencies
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      # Step 4: Restore dependencies
      - name: Restore
        run: |
          echo "::group::dotnet restore output"
          dotnet restore PokeTeams.sln
          echo "::endgroup::"

      # Step 5: Build application
      - name: Build
        run: dotnet build PokeTeams.sln -c Release --no-restore

      # Step 6: Run tests
      - name: Test
        run: dotnet test PokeTeams.sln -c Release --no-build --logger "trx;LogFileName=results.trx" --results-directory TestResults

      # Step 7: Generate job summary
      - name: Job summary
        if: always()
        run: |
          echo "::notice title=Build::Built ${GITHUB_SHA::7} on ${{ runner.os }}"

          COUNTERS=$(grep -o '<Counters [^>]*' TestResults/results.trx || echo "no test results")

          {
            echo "## PokeTeams CI"
            echo "| Item | Value |"
            echo "|---|---|"
            echo "| Commit | \`${GITHUB_SHA::7}\` |"
            echo "| Trigger | ${{ github.event_name }} |"
            echo "| Actor | ${GITHUB_ACTOR} |"
            echo "| Tests | \`${COUNTERS}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  # PHASE 2.2 & 2.3: Publish app and reuse YAML anchor
  publish:
    needs: test
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.ver.outputs.version }}

    steps:
      # Step 1: Checkout repository
      - uses: actions/checkout@v6

      # Step 2: Reuse setup-dotnet anchor from test job
      - *setup-dotnet

      # Step 3: Generate application version
      - id: ver
        run: |
          echo "version=1.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "APP_VERSION=1.0.${{ github.run_number }}" >> "$GITHUB_ENV"

      # Step 4: Publish Blazor application
      - name: Publish application
        run: dotnet publish src/PokeTeams.Web -c Release -o out -p:InformationalVersion=$APP_VERSION

      # Step 5: Create ZIP package
      - name: Create ZIP
        run: cd out && zip -r ../poketeams.zip .

      # Step 6: Upload artifact to GitHub
      - uses: actions/upload-artifact@v7
        with:
          name: poketeams-web
          path: poketeams.zip
          retention-days: 5

      # Step 7: Add published version to summary
      - name: Publish summary
        run: echo "Published **$APP_VERSION**" >> "$GITHUB_STEP_SUMMARY"
